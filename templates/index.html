<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — Student Collaboration Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">🎓 StudentCollab Login</h1>
            <p class="text-xs text-slate-500 mt-1">Enter your registered email to access your portal</p>
        </div>
        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl mb-4">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-slate-600 block mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="e.g. aarav@college.edu or admin@college.edu" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">
                Secure Login
            </button>
        </form>
        <div class="mt-6 text-center text-[11px] text-slate-400">
